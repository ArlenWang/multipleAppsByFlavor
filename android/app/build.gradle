plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

apply from: "${rootProject.projectDir}/gradle/config/app-profiles.gradle"

android {
    namespace 'com.smarola.app'
    compileSdk 36
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.smarola.demo"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions += "brand"
    productFlavors {
        appProfiles.each { profileName, profile ->
            create(profileName) {
                dimension "brand"
                applicationId profile.applicationId
                versionNameSuffix profile.versionNameSuffix
                resValue "string", "app_name", "\"${profile.appName}\""
                resValue "color", "brand_primary", profile.primaryColor
                manifestPlaceholders = [
                        appScheme   : profile.scheme,
                        appFlavor   : profileName,
                        defaultWebUrl: profile.defaultWebUrl
                ]
                buildConfigField "String", "APP_TYPE", "\"${profileName}\""
                buildConfigField "String", "APP_SCHEME", "\"${profile.scheme}\""
                buildConfigField "String", "DEFAULT_WEB_URL", "\"${profile.defaultWebUrl}\""
                buildConfigField "boolean", "RN_ENABLED", profile.rnEnabled.toString()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation project(path: ':main')
    implementation project(path: ':core')
}
